{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="paper">
  <div class="content">
    <h1>{{ .Title }}</h1>
    <p>Browse all {{ lower .Title }}:</p>
  </div>

  <div class="blog-list">
    {{ range .Data.Terms.Alphabetical }}
      <article class="blog-item">
        <h2 class="blog-item-title">
          <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
        </h2>
        <div class="blog-item-meta">
          <span>{{ .Count }} {{ if eq .Count 1 }}article{{ else }}articles{{ end }}</span>
        </div>
      </article>
    {{ end }}
  </div>
</div>
{{ end }}
