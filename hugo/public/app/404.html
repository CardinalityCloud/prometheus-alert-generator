<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Prometheus Alert Rule Generator</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        max-width: 600px;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-radius: 1rem;
        padding: 3rem;
        text-align: center;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }

      .error-code {
        font-size: 8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }

      .error-graphic {
        width: 200px;
        height: 200px;
        margin: 0 auto 2rem;
        position: relative;
      }

      .error-graphic svg {
        width: 100%;
        height: 100%;
      }

      h1 {
        font-size: 2rem;
        color: #1a1a1a;
        margin-bottom: 1rem;
        font-weight: 700;
      }

      p {
        font-size: 1.125rem;
        color: #666;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn svg {
        display: inline-block;
        vertical-align: middle;
        margin-right: 0.5rem;
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>

      <div class="error-graphic">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Alert triangle icon -->
          <g transform="translate(100, 100)">
            <!-- Outer glow -->
            <circle cx="0" cy="0" r="85" fill="#667eea" opacity="0.1"/>
            <circle cx="0" cy="0" r="70" fill="#764ba2" opacity="0.15"/>

            <!-- Alert triangle -->
            <path d="M 0,-50 L 43,35 L -43,35 Z" fill="none" stroke="#667eea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Exclamation mark -->
            <line x1="0" y1="-20" x2="0" y2="10" stroke="#764ba2" stroke-width="6" stroke-linecap="round"/>
            <circle cx="0" cy="22" r="4" fill="#764ba2"/>
          </g>

          <!-- Floating particles -->
          <circle cx="30" cy="30" r="3" fill="#667eea" opacity="0.6">
            <animate attributeName="cy" values="30;25;30" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="170" cy="50" r="2" fill="#764ba2" opacity="0.5">
            <animate attributeName="cy" values="50;45;50" dur="2.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="160" cy="160" r="3" fill="#667eea" opacity="0.4">
            <animate attributeName="cy" values="160;155;160" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="40" cy="170" r="2" fill="#764ba2" opacity="0.6">
            <animate attributeName="cy" values="170;165;170" dur="2.2s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>

      <h1>Page Not Found</h1>
      <p>
        Oops! The page you're looking for doesn't exist.
        It may have been moved or deleted.
      </p>

      <a href="/" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="M5 12l6 6"></path>
          <path d="M5 12l6-6"></path>
        </svg>
        Back to Generator
      </a>
    </div>
  </body>
</html>
